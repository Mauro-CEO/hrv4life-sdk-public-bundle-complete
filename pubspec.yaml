name: hrv4life_sdk
description: "Flutter package for HRV (Heart Rate Variability) monitoring using camera PPG"
version: 1.0.0
homepage: https://hrv4life.com

environment:
  sdk: ^3.9.2
  flutter: '>=3.3.0'

dependencies:
  flutter:
    sdk: flutter
  camera: ^0.10.5+9
  dio: ^5.4.0
  ffi: ^2.1.0
  fl_chart: ^0.69.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  plugin:
    platforms:
      android:
        package: br.com.hrv4life.hrv4life_sdk
        pluginClass: Hrv4lifeSdkPlugin
      ios:
        pluginClass: Hrv4lifeSdkPlugin
